# Firmware del Polpo, Polpo Studio e app per Android: test, controlli e pacchetti per Windows, Linux e Android.
name: Polpo

on:
  push:
    paths: ["polpo/**", "studio/**", "android/**", "site/**", ".github/workflows/polpo.yml"]
  pull_request:
    paths: ["polpo/**", "studio/**", "android/**", "site/**", ".github/workflows/polpo.yml"]
  workflow_dispatch:
    inputs:
      pubblica:
        description: "Versione da pubblicare come Release (es. 0.3.0). Vuoto = solo build e test."
        required: false
        default: ""

permissions:
  contents: read

jobs:
  firmware:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: PlatformIO
        run: pip install platformio==6.2.0
      - name: Test della parte pura (polpo_core)
        working-directory: polpo
        run: pio test -e native
      - name: Solo Polpo Link scrive sulla porta seriale
        run: |
          if grep -rnE "Serial\.(print|println|printf|write)\b" polpo/src | grep -v "^polpo/src/link/"; then
            echo "Codice fuori da src/link scrive su Serial: disturberebbe Polpo Link"; exit 1
          fi
      # Gli script non possono trasmettere né scrivere come una tastiera: il codice che li esegue non deve
      # nemmeno includere i moduli che lo fanno.
      - name: PolpoScript, cosa può toccare uno script
        run: python3 polpo/scripts/check_script.py
      - name: Compilazione del firmware
        working-directory: polpo
        run: pio run -e cardputer
      - name: PolpoScript, pila usata dal compilatore sul Cardputer (caso peggiore)
        run: python3 polpo/scripts/check_script.py --pila
      # Il firmware vero eseguito sul PC (polpo/sim): prove dell'interfaccia con controlli di memoria.
      # Usa le stesse librerie appena scaricate per il dispositivo.
      - name: Simulatore, compilazione
        run: |
          sudo apt-get install -y ninja-build
          cmake -S polpo/sim -B build/sim -G Ninja
          cmake --build build/sim
      - name: Simulatore, prove dell'interfaccia
        run: ctest --test-dir build/sim --output-on-failure

  # Il firmware vero compilato in WebAssembly: lo usano il simulatore del sito e il Polpo virtuale di Polpo Studio
  # (per gli script). Deve dare gli stessi identici risultati della versione per PC.
  simulatore-web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Strumenti
        run: |
          pip install platformio==6.2.0
          sudo apt-get install -y ninja-build
      - name: Compilazione per WebAssembly
        run: polpo/sim/scripts/compila_web.sh build/web "$RUNNER_TEMP/emscripten"
      - name: Le prove dell'interfaccia sul modulo WebAssembly
        run: |
          for c in polpo/sim/tests/*.copione; do
            python3 polpo/sim/tests/confronta.py "node polpo/sim/tests/esegui_wasm.mjs build/web/polpo-sim.wasm" "$c"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: polpo-sim
          path: |
            build/web/polpo-sim.wasm
            build/web/licenze/
          if-no-files-found: error

  studio-test:
    needs: simulatore-web
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - uses: actions/download-artifact@v4
        with: { name: polpo-sim, path: firmware-web }
      - name: Firmware simulato per gli script del Polpo virtuale
        run: |
          cp firmware-web/polpo-sim.wasm studio/polpo_studio/resources/
          cp -r firmware-web/licenze studio/polpo_studio/resources/polpo-sim-licenze
      - name: Librerie di sistema per Qt
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Dipendenze
        working-directory: studio
        run: pip install -e ".[dev]"
      - name: Test (interfaccia senza schermo)
        working-directory: studio
        # le prove degli script non si possono saltare: il firmware simulato qui c'è sempre
        env: { QT_QPA_PLATFORM: offscreen, POLPO_FIRMWARE_SIM: obbligatorio }
        run: python -m pytest -q
      # Studio nel telefono è scritto in JavaScript: deve dare gli stessi risultati di Polpo Studio per PC. I casi di
      # prova si generano qui dal codice Python e devono essere quelli salvati nel repository.
      - name: Studio nel telefono, casi di prova generati da Polpo Studio
        run: |
          shopt -s nullglob
          for g in site/tests/studio/casi/genera_*.py; do python "$g"; done
          git diff --exit-code -- site/tests/studio/casi || { echo "Casi di prova non aggiornati: rigenerali e salvali"; exit 1; }
      - name: Studio nel telefono, prove JavaScript (parità, cassaforte compatibile, collegamento)
        env:
          POLPO_SIM_WASM: ${{ github.workspace }}/firmware-web/polpo-sim.wasm
        run: POLPO_PYTHON="$(command -v python)" node --test "site/tests/studio/**/*.test.mjs"

  package:
    needs: studio-test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Librerie di sistema per Qt (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Dipendenze
        working-directory: studio
        run: pip install . pyinstaller==6.22.0
      - name: Firmware incluso (solo l'applicazione, per gli aggiornamenti)
        shell: bash
        run: mkdir -p studio/polpo_studio/resources/firmware && cp polpo/release/polpo-cardputer-*-app.bin studio/polpo_studio/resources/firmware/
      - uses: actions/download-artifact@v4
        with: { name: polpo-sim, path: firmware-web }
      - name: Firmware simulato (gli script nel Polpo virtuale) e licenze delle librerie che contiene
        shell: bash
        run: |
          cp firmware-web/polpo-sim.wasm studio/polpo_studio/resources/
          cp -r firmware-web/licenze studio/polpo_studio/resources/polpo-sim-licenze
      - name: PyInstaller
        working-directory: studio
        run: pyinstaller --noconfirm packaging/polpo_studio.spec
      - name: Autodiagnosi del pacchetto (Linux)
        if: runner.os == 'Linux'
        working-directory: studio
        env: { QT_QPA_PLATFORM: offscreen }
        run: ./dist/PolpoStudio/PolpoStudio --self-test
      - name: Autodiagnosi del pacchetto (Windows)
        if: runner.os == 'Windows'
        working-directory: studio
        shell: pwsh
        env: { QT_QPA_PLATFORM: offscreen }
        run: |
          $p = Start-Process -FilePath .\dist\PolpoStudio\PolpoStudio.exe -ArgumentList "--self-test" -Wait -PassThru
          Get-Content "$env:TEMP\polpo-studio-autodiagnosi.txt"
          if ($p.ExitCode -ne 0) { exit 1 }
      - name: Archivio Linux
        if: runner.os == 'Linux'
        working-directory: studio
        run: |
          mkdir -p out/PolpoStudio-linux && cp -r dist/PolpoStudio packaging/linux/* out/PolpoStudio-linux/
          tar -C out -czf PolpoStudio-linux-x64.tar.gz PolpoStudio-linux
      - name: Installer e zip Windows
        if: runner.os == 'Windows'
        working-directory: studio
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $v = (Select-String -Path polpo_studio\__init__.py -Pattern '__version__ = "(.*)"').Matches[0].Groups[1].Value
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DAppVersion=$v /DSourceDir=..\..\dist\PolpoStudio packaging\windows\polpo_studio.iss
          Compress-Archive -Path dist\PolpoStudio -DestinationPath PolpoStudio-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: PolpoStudio-${{ runner.os }}
          path: |
            studio/PolpoStudio-linux-x64.tar.gz
            studio/PolpoStudio-windows-x64.zip
            studio/packaging/windows/Output/*.exe
          if-no-files-found: ignore

  # L'app per Android: le pagine del sito costruite per il telefono, con il firmware vero per il simulatore.
  android:
    needs: simulatore-web
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.14.3" }
      - uses: actions/download-artifact@v4
        with: { name: polpo-sim, path: firmware-web }
      - name: Pagine dell'app
        run: |
          pip install markdown==3.11.3
          android/prepara_sito.sh firmware-web
      - name: Le pagine dell'app nel browser, con lo schermo di un telefono
        working-directory: site
        env:
          APP_DIR: ${{ github.workspace }}/android/app/build/sito
          SITO_DIR: ${{ github.workspace }}/android/app/build/sito
        run: |
          npm ci && npx playwright install --with-deps chromium
          node --test tests/e2e/app.test.mjs tests/e2e/studio.test.mjs
      - name: Compilazione, prove e controlli di Android
        working-directory: android
        run: gradle --no-daemon assembleDebug testDebugUnitTest lintDebug assembleDebugAndroidTest
      - name: L'app non chiede il permesso Internet
        run: |
          AAPT2="$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)"
          "$AAPT2" dump permissions android/app/build/outputs/apk/debug/app-debug.apk | tee permessi.txt
          if grep -q "android.permission.INTERNET" permessi.txt; then echo "L'app chiede il permesso Internet"; exit 1; fi
      - name: KVM per l'emulatore
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Prove su un telefono emulato (Android 14)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          working-directory: android
          script: gradle --no-daemon connectedDebugAndroidTest
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: android-rapporti
          path: android/app/build/reports/
          if-no-files-found: ignore
      # Solo per la pubblicazione: la chiave di firma arriva dai segreti del repository (vedi android/LEGGIMI.md).
      - name: APK firmato
        if: github.event_name == 'workflow_dispatch' && inputs.pubblica != ''
        env:
          CHIAVE: ${{ secrets.POLPO_ANDROID_KEYSTORE }}
          POLPO_FIRMA_PASSWORD: ${{ secrets.POLPO_ANDROID_PASSWORD }}
        run: |
          if [ -z "$CHIAVE" ] || [ -z "$POLPO_FIRMA_PASSWORD" ]; then
            echo "::error title=Manca la chiave di firma::Aggiungi i segreti POLPO_ANDROID_KEYSTORE e POLPO_ANDROID_PASSWORD (Settings › Secrets and variables › Actions), poi riavvia."
            exit 1
          fi
          export POLPO_FIRMA_FILE="$RUNNER_TEMP/polpo.p12"
          printf '%s' "$CHIAVE" | tr -d ' \r\n\t' | base64 -d > "$POLPO_FIRMA_FILE"
          (cd android && gradle --no-daemon assembleRelease lintRelease) || { rm -f "$POLPO_FIRMA_FILE"; exit 1; }
          rm -f "$POLPO_FIRMA_FILE"
          APK=android/app/build/outputs/apk/release/app-release.apk
          APKSIGNER="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
          "$APKSIGNER" verify --print-certs "$APK" | tee firma.txt
          ATTESA="$(tr -d ':\n' < android/certificato-sha256.txt | tr 'A-F' 'a-f')"
          grep -q "certificate SHA-256 digest: $ATTESA" firma.txt || { echo "::error::L'APK non è firmato con il certificato di android/certificato-sha256.txt"; exit 1; }
          cp "$APK" Polpo-Android.apk
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch' && inputs.pubblica != ''
        with:
          name: Polpo-Android
          path: Polpo-Android.apk
          if-no-files-found: error

  # Release pubblica: si avvia a mano (Actions › Polpo › Run workflow) scrivendo la versione.
  release:
    if: github.event_name == 'workflow_dispatch' && inputs.pubblica != ''
    needs: [firmware, package, android]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: La versione chiesta è quella del codice
        env:
          CHIESTA: ${{ inputs.pubblica }}
        run: |
          V="${CHIESTA#v}"
          grep -q "__version__ = \"$V\"" studio/polpo_studio/__init__.py || { echo "Polpo Studio non è alla versione $V"; exit 1; }
          grep -q "VERSION = \"$V\"" polpo/scripts/version.py || { echo "Il firmware non è alla versione $V"; exit 1; }
          test -f "polpo/release/polpo-cardputer-$V.bin" || { echo "Manca polpo/release/polpo-cardputer-$V.bin"; exit 1; }
          echo "V=$V" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with: { path: artefatti }
      - name: Prepara i file con nomi fissi
        run: |
          mkdir out
          cp "$(find artefatti -name 'PolpoStudio-linux-x64.tar.gz')" out/
          cp "$(find artefatti -name 'PolpoStudio-windows-x64.zip')" out/
          cp "$(find artefatti -name '*-Windows-setup.exe')" out/PolpoStudio-Windows-setup.exe
          cp "polpo/release/polpo-cardputer-$V.bin" "polpo/release/polpo-cardputer-$V-app.bin" out/
          cp "$(find artefatti -name 'Polpo-Android.apk')" out/
          pip install markdown==3.11.3
          python site/build.py --out _site
          cp _site/installa/sd-polpo.zip out/
          (cd out && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt)
      - name: Crea la Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # l'indirizzo del sito segue il nome del repository
          SITO="https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}/"
          sed "s#{{sito}}#$SITO#g" .github/release-notes.md > note.md
          if gh release view "v$V" > /dev/null 2>&1; then
            echo "La Release v$V esiste già: aggiorno solo le note, i file restano quelli pubblicati."
            gh release edit "v$V" --notes-file note.md
          else
            gh release create "v$V" out/* --target "$GITHUB_SHA" --title "Polpo $V" --notes-file note.md
          fi
