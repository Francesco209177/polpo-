# Costruisce il sito del Polpo (cartella site/) e lo pubblica su GitHub Pages.
# Prima pubblicazione: Settings › Pages › Build and deployment › Source: "GitHub Actions".
name: Sito

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "polpo/simulator/**"
      - "polpo/src/**"
      - "polpo/lib/**"
      - "polpo/include/**"
      - "polpo/sim/**"
      - "polpo/platformio.ini"
      - "polpo/release/**"
      - "polpo/sd_template/**"
      - "polpo/docs/**"
      - "polpo/scripts/version.py"
      - "studio/docs/**"
      - "studio/bridge/LEGGIMI.md"
      - "studio/polpo_studio/__init__.py"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: read
    outputs:
      pubblica: ${{ steps.pages.outcome == 'success' && github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Dipendenze
        run: |
          pip install markdown==3.11.3 platformio==6.2.0
          sudo apt-get install -y ninja-build
      - name: Prove del modem di Polpo Onde
        working-directory: site
        run: npm test
      - name: Indirizzo del sito
        id: pages
        if: github.event_name != 'pull_request'
        continue-on-error: true   # se Pages non è ancora attivo il sito si costruisce lo stesso, senza pubblicarlo
        uses: actions/configure-pages@v5
      - name: Costruisci e controlla il sito
        env:
          SITO: ${{ steps.pages.outputs.base_url || format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}
        run: |
          # il firmware vero compilato per il browser: lo usa la pagina del simulatore
          polpo/sim/scripts/compila_web.sh "$RUNNER_TEMP/firmware-web" "$RUNNER_TEMP/emscripten"
          python site/build.py --out _site --check --repo "$GITHUB_REPOSITORY" --site-url "$SITO/" --firmware-web "$RUNNER_TEMP/firmware-web"
      - name: Browser per le prove
        working-directory: site
        run: npm ci && npx playwright install --with-deps chromium
      - name: Prove nel browser sul sito appena costruito
        working-directory: site
        env:
          SITO_DIR: ${{ github.workspace }}/_site
        run: npm run test:browser
      - name: Avviso se Pages non è attivo
        if: github.event_name != 'pull_request' && steps.pages.outcome != 'success'
        run: echo "::warning title=Sito non pubblicato::GitHub Pages non è attivo. Vai in Settings › Pages, scegli Source «GitHub Actions», poi riavvia questo workflow."
      - uses: actions/upload-pages-artifact@v3
        if: steps.pages.outcome == 'success' && github.event_name != 'pull_request'
        with: { path: _site }

  deploy:
    needs: build
    if: needs.build.outputs.pubblica == 'true'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
